<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Drei Vertikalschnitte durch den Fenstersturz: Aufsatzkasten auf dem Blendrahmen, Vorbaukasten vor der Fassade, Einbaukasten im Mauerwerk über dem Sturz">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1a17" stroke-width="0.7"/>
    </pattern>
  </defs>
  <!-- Schnitt 1: Aufsatzkasten -->
  <text x="90" y="22" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Aufsatzkasten</text>
  <rect x="70" y="40" width="40" height="70" fill="url(#hatch)" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="72" y="110" width="36" height="50" fill="#b05c3a" fill-opacity="0.18" stroke="#b05c3a" stroke-width="2.2"/>
  <rect x="78" y="160" width="24" height="18" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="86" y="178" width="8" height="82" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <line x1="72" y1="160" x2="108" y2="160" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Schnitt 2: Vorbaukasten -->
  <text x="240" y="22" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Vorbaukasten</text>
  <rect x="220" y="40" width="40" height="120" fill="url(#hatch)" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="260" y="120" width="44" height="44" fill="#b05c3a" fill-opacity="0.18" stroke="#b05c3a" stroke-width="2.2"/>
  <rect x="228" y="160" width="24" height="18" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="236" y="178" width="8" height="82" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Schnitt 3: Einbaukasten -->
  <text x="390" y="22" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Einbaukasten</text>
  <rect x="370" y="40" width="40" height="40" fill="url(#hatch)" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="366" y="80" width="48" height="60" fill="#b05c3a" fill-opacity="0.18" stroke="#b05c3a" stroke-width="2.2"/>
  <rect x="370" y="140" width="40" height="20" fill="url(#hatch)" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="378" y="160" width="24" height="18" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="386" y="178" width="8" height="82" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Beschriftungen -->
  <text x="90" y="284" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">auf dem Rahmen,</text>
  <text x="90" y="296" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">Sturz bleibt massiv</text>
  <text x="240" y="284" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">vor der Fassade,</text>
  <text x="240" y="296" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">Wand ungestört</text>
  <text x="390" y="284" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">im Mauerwerk:</text>
  <text x="390" y="296" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">Wärmebrücke, Schallweg</text>
</svg>
