<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Vertikalschnitt durch eine Fensterbrüstung: Brüstungshöhe ab Fertigfußboden, ein tiefer Heizkörper oder eine tiefe Bank bildet ein neues Standniveau, außen die Fallhöhe bis zum Gelände">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1a17" stroke-width="0.7"/>
    </pattern>
  </defs>
  <!-- Brüstungswand geschnitten -->
  <rect x="222" y="170" width="40" height="130" fill="url(#hatch)" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Fensterelement über der Brüstung -->
  <rect x="230" y="44" width="24" height="126" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <line x1="242" y1="44" x2="242" y2="170" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Innenfensterbank -->
  <rect x="186" y="164" width="40" height="8" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Heizkörper / tiefe Bank als Aufstiegshilfe (Akzent) -->
  <rect x="170" y="176" width="44" height="60" fill="#b05c3a" fill-opacity="0.18" stroke="#b05c3a" stroke-width="2.2"/>
  <line x1="110" y1="176" x2="222" y2="176" stroke="#b05c3a" stroke-width="1.1" stroke-dasharray="4 3"/>
  <!-- Fertigfußboden innen -->
  <line x1="40" y1="240" x2="222" y2="240" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="40" y="240" width="182" height="14" fill="url(#hatch)" stroke="none"/>
  <!-- Gelände außen -->
  <line x1="262" y1="300" x2="440" y2="300" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Maß Brüstungshöhe ab OKFF -->
  <line x1="80" y1="240" x2="80" y2="164" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="76" y1="240" x2="84" y2="240" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="76" y1="164" x2="84" y2="164" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Maß ab neuem Standniveau (Akzent) -->
  <line x1="120" y1="176" x2="120" y2="164" stroke="#b05c3a" stroke-width="1.1"/>
  <line x1="116" y1="176" x2="124" y2="176" stroke="#b05c3a" stroke-width="1.1"/>
  <line x1="116" y1="164" x2="124" y2="164" stroke="#b05c3a" stroke-width="1.1"/>
  <!-- Maß Fallhöhe außen -->
  <line x1="340" y1="170" x2="340" y2="300" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="336" y1="170" x2="344" y2="170" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="336" y1="300" x2="344" y2="300" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Beschriftungen -->
  <text x="80" y="130" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Brüstungshöhe</text>
  <text x="80" y="142" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">ab Fertigfußboden</text>
  <line x1="80" y1="146" x2="80" y2="160" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="192" y1="206" x2="140" y2="286" stroke="#b05c3a" stroke-width="1.1"/><circle cx="192" cy="206" r="1.6" fill="#b05c3a"/>
  <text x="130" y="300" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">tiefe Bank oder Heizkörper:</text>
  <text x="130" y="312" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">neues Standniveau, Höhe zählt ab hier</text>
  <text x="392" y="240" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Fallhöhe außen</text>
  <text x="392" y="252" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">bis Gelände</text>
  <line x1="344" y1="236" x2="356" y2="236" stroke="#1c1a17" stroke-width="1.1"/>
  <text x="350" y="316" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Gelände</text>
  <text x="96" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Fertigfußboden innen</text>
</svg>
