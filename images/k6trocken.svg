<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Ansicht: Ständerwerk mit UA-Verstärkung der Türöffnung im Trockenbau">
  <!-- Wandkontur (stumme Kontur) -->
  <rect x="40" y="40" width="400" height="240" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="40" y1="280" x2="440" y2="280" stroke="#1c1a17" stroke-width="1.1"/>

  <!-- Regelständer (CW-Profile) -->
  <line x1="70" y1="40" x2="70" y2="280" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="110" y1="40" x2="110" y2="280" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="150" y1="40" x2="150" y2="280" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="370" y1="40" x2="370" y2="280" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="410" y1="40" x2="410" y2="280" stroke="#1c1a17" stroke-width="1.1"/>

  <!-- UA-Verstärkung der Türöffnung (Akzent) -->
  <rect x="184" y="80" width="12" height="200" fill="#b05c3a" fill-opacity="0.18" stroke="#b05c3a" stroke-width="2.2"/>
  <rect x="326" y="80" width="12" height="200" fill="#b05c3a" fill-opacity="0.18" stroke="#b05c3a" stroke-width="2.2"/>
  <rect x="184" y="74" width="154" height="12" fill="#b05c3a" fill-opacity="0.18" stroke="#b05c3a" stroke-width="2.2"/>

  <!-- Beschriftungen -->
  <line x1="190" y1="180" x2="130" y2="180" stroke="#1c1a17" stroke-width="1.1"/><circle cx="190" cy="180" r="1.6" fill="#1c1a17"/>
  <text x="126" y="184" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">UA-Profil ab ca. 25 kg Blattgewicht</text>
  <line x1="261" y1="74" x2="261" y2="54" stroke="#1c1a17" stroke-width="1.1"/><circle cx="261" cy="74" r="1.6" fill="#1c1a17"/>
  <text x="261" y="46" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Sturz, UA-verstärkt</text>
  <line x1="110" y1="220" x2="70" y2="250" stroke="#1c1a17" stroke-width="1.1"/><circle cx="110" cy="220" r="1.6" fill="#1c1a17"/>
  <text x="66" y="264" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">CW-Ständer, Regelabstand</text>
</svg>
