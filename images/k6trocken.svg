<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Türöffnung im Metallständerwerk</title>
  <desc id="desc">Ansicht einer Metallständerwand mit regelmäßigen CW-Ständern, zwei hervorgehobenen UA-Verstärkungsprofilen und einem Sturzprofil über der Türöffnung.</desc>
  <defs>
    <style>.heavy{fill:none;stroke:#1d1b18;stroke-width:3.2;stroke-linejoin:miter}.fine{fill:none;stroke:#1d1b18;stroke-width:1.5;stroke-linejoin:miter}.accent{fill:#b05c3a;fill-opacity:.2;stroke:#b05c3a;stroke-width:3.2}.label{font:16px Arial,Helvetica,sans-serif;fill:#1d1b18}.small{font:14px Arial,Helvetica,sans-serif;fill:#57524c}</style>
  </defs>
  <rect width="720" height="480" fill="#faf9f6"/>
  <!-- UW-Randprofile -->
  <path d="M54 76H666V94H54ZM54 408H666V426H54Z" class="heavy"/>
  <!-- CW-Ständer, als offene Profile lesbar -->
  <g class="fine">
    <path d="M96 94v314m0-304h13v294H96"/>
    <path d="M164 94v314m0-304h13v294h-13"/>
    <path d="M232 94v314m0-304h13v88M245 335v63h-13"/>
    <path d="M488 94v94m0 147v73m0-304h13v84M501 335v63h-13"/>
    <path d="M556 94v314m0-304h13v294h-13"/>
    <path d="M624 94v314m0-304h13v294h-13"/>
  </g>
  <!-- Öffnung und UA-Verstärkung -->
  <rect x="259" y="177" width="22" height="231" class="accent"/>
  <rect x="465" y="177" width="22" height="231" class="accent"/>
  <path d="M259 157H487V177H259Z" fill="#faf9f6" stroke="#1d1b18" stroke-width="3.2"/>
  <path d="M280 177H466M280 408V177M466 177V408" class="heavy"/>
  <!-- Labels -->
  <line x1="171" y1="262" x2="103" y2="304" class="fine"/><circle cx="171" cy="262" r="3" fill="#1d1b18"/>
  <text x="96" y="310" text-anchor="end" class="label">CW-Ständer</text>
  <line x1="476" y1="278" x2="520" y2="278" class="fine"/><circle cx="476" cy="278" r="3" fill="#1d1b18"/>
  <text x="528" y="284" class="label">UA-Verstärkungsprofil</text>
  <text x="528" y="306" class="small">ab ca. 25 kg Blattgewicht</text>
  <line x1="374" y1="157" x2="374" y2="112" class="fine"/><circle cx="374" cy="157" r="3" fill="#1d1b18"/>
  <text x="374" y="101" text-anchor="middle" class="label">Sturzprofil</text>
</svg>
