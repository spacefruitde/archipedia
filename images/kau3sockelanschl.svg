<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Sockelanschluss mit hochgeführter Abdichtung</title>
  <desc id="desc">Vertikalschnitt einer Außenwand am Gelände. Die Abdichtung wird etwa fünfzehn Zentimeter über Gelände hochgeführt; Kiesstreifen und Gefälle schützen die Spritzwasserzone.</desc>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#1d1b18" stroke-width="1"/></pattern>
    <pattern id="gravel" width="28" height="20" patternUnits="userSpaceOnUse"><circle cx="7" cy="10" r="4" fill="none" stroke="#6d6861" stroke-width="1"/><circle cx="21" cy="7" r="3" fill="none" stroke="#6d6861" stroke-width="1"/><circle cx="18" cy="18" r="4" fill="none" stroke="#6d6861" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1d1b18"/></marker>
    <marker id="dim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 1L1 4L8 7" fill="none" stroke="#1d1b18" stroke-width="1.2"/></marker>
    <style>.cut{fill:url(#hatch);stroke:#1d1b18;stroke-width:3.2}.fine{fill:none;stroke:#1d1b18;stroke-width:1.5}.label{font:16px Arial,Helvetica,sans-serif;fill:#1d1b18}.small{font:14px Arial,Helvetica,sans-serif;fill:#57524c}</style>
  </defs>
  <rect width="720" height="480" fill="#faf9f6"/>
  <!-- Außenwand und Sockel -->
  <rect x="82" y="38" width="188" height="392" class="cut"/>
  <rect x="270" y="72" width="54" height="358" fill="#f0ede7" stroke="#1d1b18" stroke-width="3.2"/>
  <line x1="274" y1="86" x2="274" y2="414" stroke="#8a857d" stroke-width="1.2" stroke-dasharray="4 5"/>
  <!-- Gelände mit Gefälle und Kiesstreifen -->
  <path d="M324 308H446L446 415H324Z" fill="url(#gravel)" stroke="#1d1b18" stroke-width="2"/>
  <path d="M446 326L696 366V430H446Z" fill="#eeeae3" stroke="#1d1b18" stroke-width="2"/>
  <line x1="446" y1="326" x2="696" y2="366" stroke="#1d1b18" stroke-width="3.2"/>
  <!-- Abdichtung -->
  <path d="M326 430V215H306" fill="none" stroke="#b05c3a" stroke-width="5"/>
  <!-- Maß Anschlusshöhe -->
  <line x1="354" y1="216" x2="354" y2="308" class="fine" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="326" y1="215" x2="366" y2="215" class="fine"/><line x1="326" y1="308" x2="366" y2="308" class="fine"/>
  <text x="369" y="257" class="label">ca. 15 cm</text>
  <text x="369" y="279" class="small">über Gelände</text>
  <!-- Hinweise -->
  <line x1="326" y1="235" x2="474" y2="132" class="fine"/><circle cx="326" cy="235" r="3" fill="#1d1b18"/>
  <text x="482" y="127" class="label">Abdichtung hochgeführt</text>
  <line x1="389" y1="347" x2="533" y2="240" class="fine"/><circle cx="389" cy="347" r="3" fill="#1d1b18"/>
  <text x="541" y="236" class="label">Spritzwasserzone</text>
  <text x="541" y="258" class="small">Kiesstreifen</text>
  <line x1="493" y1="305" x2="644" y2="329" class="fine" marker-end="url(#arrow)"/>
  <text x="566" y="291" text-anchor="middle" class="label">Gefälle vom Gebäude weg</text>
</svg>
