<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Horizontalschnitt durch eine Wärmeschutz-Mehrfachverglasung mit Gasfüllung und Beschichtung">
  <!-- Rahmenfragmente (stumme Kontur) -->
  <rect x="170" y="55" width="124" height="15" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <rect x="170" y="250" width="124" height="15" fill="none" stroke="#1c1a17" stroke-width="1.1"/>

  <!-- Scheiben -->
  <rect x="180" y="70" width="8" height="180" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="228" y="70" width="8" height="180" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="276" y="70" width="8" height="180" fill="none" stroke="#1c1a17" stroke-width="2.2"/>

  <!-- Wärmereflektierende Beschichtung (Akzent) -->
  <line x1="188" y1="70" x2="188" y2="250" stroke="#b05c3a" stroke-width="2.2"/>

  <!-- Beschriftungen -->
  <line x1="232" y1="70" x2="232" y2="40" stroke="#1c1a17" stroke-width="1.1"/><circle cx="232" cy="70" r="1.6" fill="#1c1a17"/>
  <text x="232" y="32" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Scheibe (2- bis 3-fach)</text>

  <line x1="208" y1="250" x2="208" y2="290" stroke="#1c1a17" stroke-width="1.1"/><circle cx="208" cy="250" r="1.6" fill="#1c1a17"/>
  <text x="208" y="304" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Gasfüllung im Scheibenzwischenraum</text>

  <line x1="188" y1="70" x2="188" y2="24" stroke="#1c1a17" stroke-width="1.1"/><circle cx="188" cy="70" r="1.6" fill="#1c1a17"/>
  <text x="188" y="18" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">wärmereflektierende Beschichtung</text>
</svg>
