<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Horizontalschnitt Fensteranschluss: drei Dichtungsebenen der Montagefuge">
  <defs>
    <pattern id="schraffur" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1a17" stroke-width="0.7"/>
    </pattern>
  </defs>
  <!-- Wand im Horizontalschnitt, Fuge in der Mitte, Fensterrahmen rechts der Fuge -->
  <text x="70" y="66" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">innen</text>
  <text x="410" y="66" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">außen</text>
  <!-- Wand (geschnitten) -->
  <rect x="40" y="90" width="180" height="120" fill="url(#schraffur)" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Fensterrahmen (geschnitten) -->
  <rect x="272" y="104" width="168" height="92" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <line x1="272" y1="150" x2="440" y2="150" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Fuge zwischen Wand und Rahmen: drei Ebenen -->
  <!-- Ebene 1 innen: luftdicht (Akzent) -->
  <rect x="220" y="90" width="10" height="120" fill="#b05c3a" fill-opacity="0.18" stroke="#b05c3a" stroke-width="2.2"/>
  <!-- Ebene 2 Mitte: Dämmung -->
  <path d="M 232 96 q 4 4 0 8 q -4 4 0 8 q 4 4 0 8 q -4 4 0 8 q 4 4 0 8 q -4 4 0 8 q 4 4 0 8 q -4 4 0 8 q 4 4 0 8 q -4 4 0 8 q 4 4 0 8 q -4 4 0 8 q 4 4 0 8" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <path d="M 248 96 q 4 4 0 8 q -4 4 0 8 q 4 4 0 8 q -4 4 0 8 q 4 4 0 8 q -4 4 0 8 q 4 4 0 8 q -4 4 0 8 q 4 4 0 8 q -4 4 0 8 q 4 4 0 8 q -4 4 0 8 q 4 4 0 8" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Ebene 3 außen: schlagregendicht, diffusionsoffen -->
  <rect x="262" y="90" width="10" height="120" fill="none" stroke="#1c1a17" stroke-width="2.2" stroke-dasharray="5 3"/>
  <!-- Beschriftungen: oben und unten, zentriert -->
  <line x1="225" y1="90" x2="150" y2="46" stroke="#1c1a17" stroke-width="1.1"/><circle cx="225" cy="90" r="1.6" fill="#1c1a17"/>
  <text x="150" y="38" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">1 · innen: luftdicht (dichteste Ebene)</text>
  <line x1="240" y1="210" x2="160" y2="258" stroke="#1c1a17" stroke-width="1.1"/><circle cx="240" cy="210" r="1.6" fill="#1c1a17"/>
  <text x="160" y="272" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">2 · Mitte: Dämmebene der Fuge</text>
  <line x1="267" y1="90" x2="352" y2="46" stroke="#1c1a17" stroke-width="1.1"/><circle cx="267" cy="90" r="1.6" fill="#1c1a17"/>
  <text x="352" y="38" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">3 · außen: schlagregendicht,</text>
  <text x="352" y="50" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">aber diffusionsoffen</text>
  <line x1="340" y1="210" x2="340" y2="256" stroke="#1c1a17" stroke-width="1.1"/><circle cx="340" cy="210" r="1.6" fill="#1c1a17"/>
  <text x="340" y="272" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Fensterrahmen</text>
  <line x1="130" y1="210" x2="80" y2="256" stroke="#1c1a17" stroke-width="1.1"/><circle cx="130" cy="210" r="1.6" fill="#1c1a17"/>
  <text x="80" y="272" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Wand</text>
  <!-- Diffusionspfeil nach außen -->
  <line x1="246" y1="300" x2="300" y2="300" stroke="#b05c3a" stroke-width="1.1"/>
  <path d="M 300 300 L 291 295 L 292 304 Z" fill="#b05c3a"/>
  <text x="180" y="304" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">Feuchte trocknet nach außen</text>
</svg>
