<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Schnitt: Nullschwelle mit Entwässerungsrinne">
  <defs>
    <pattern id="schraffur" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1a17" stroke-width="0.7"/>
    </pattern>
  </defs>
  <!-- Innenraum: Estrich auf Dämmung -->
  <rect x="40" y="196" width="180" height="26" fill="url(#schraffur)" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="40" y="222" width="180" height="20" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <rect x="40" y="242" width="180" height="30" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Türelement mit Schwellenprofil -->
  <rect x="220" y="90" width="18" height="106" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="216" y="188" width="26" height="10" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Rinne (Akzent) -->
  <rect x="246" y="196" width="40" height="34" fill="#b05c3a" fill-opacity="0.18" stroke="#b05c3a" stroke-width="2.2"/>
  <line x1="250" y1="204" x2="282" y2="204" stroke="#b05c3a" stroke-width="1.1"/>
  <line x1="250" y1="210" x2="282" y2="210" stroke="#b05c3a" stroke-width="1.1"/>
  <!-- Außenbelag mit Gefälle vom Gebäude weg -->
  <line x1="286" y1="200" x2="440" y2="212" stroke="#1c1a17" stroke-width="2.2"/>
  <line x1="286" y1="230" x2="440" y2="242" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Abdichtung, hochgeführt -->
  <path d="M 220 236 L 246 236 L 246 200" fill="none" stroke="#1c1a17" stroke-width="1.1" stroke-dasharray="5 3"/>
  <!-- Gefällepfeil -->
  <line x1="330" y1="188" x2="392" y2="193" stroke="#1c1a17" stroke-width="1.1"/>
  <path d="M 392 193 L 383 188 L 384 197 Z" fill="#1c1a17"/>
  <!-- Beschriftungen -->
  <line x1="130" y1="196" x2="130" y2="150" stroke="#1c1a17" stroke-width="1.1"/><circle cx="130" cy="196" r="1.6" fill="#1c1a17"/>
  <text x="130" y="142" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Estrich, gefällefrei bis zur Tür</text>
  <line x1="266" y1="196" x2="266" y2="86" stroke="#1c1a17" stroke-width="1.1"/><circle cx="266" cy="196" r="1.6" fill="#1c1a17"/>
  <text x="266" y="78" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Rinne mit freiem Ablauf</text>
  <line x1="246" y1="216" x2="180" y2="288" stroke="#1c1a17" stroke-width="1.1"/><circle cx="246" cy="216" r="1.6" fill="#1c1a17"/>
  <text x="176" y="302" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Abdichtung hochgeführt</text>
  <text x="364" y="180" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Gefälle vom Gebäude weg</text>
</svg>
