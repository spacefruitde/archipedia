<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Drei Dichtebenen der Fenstermontage</title>
  <desc id="desc">Horizontalschnitt eines Fensteranschlusses mit innen luftdichter Ebene, Dämmung in der Mitte und außen schlagregendichter, diffusionsoffener Ebene. Ein Pfeil zeigt die Trocknungsrichtung nach außen.</desc>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#1d1b18" stroke-width="1"/></pattern>
    <marker id="arrowAccent" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b05c3a"/></marker>
    <style>.cut{fill:url(#hatch);stroke:#1d1b18;stroke-width:3.2}.frame{fill:#faf9f6;stroke:#1d1b18;stroke-width:3.2}.fine{fill:none;stroke:#1d1b18;stroke-width:1.5}.label{font:16px Arial,Helvetica,sans-serif;fill:#1d1b18}.small{font:14px Arial,Helvetica,sans-serif;fill:#57524c}.num{font:bold 15px Arial,Helvetica,sans-serif;fill:#faf9f6}</style>
  </defs>
  <rect width="720" height="480" fill="#faf9f6"/>
  <text x="74" y="43" class="label">innen</text>
  <text x="646" y="43" text-anchor="end" class="label">außen</text>
  <line x1="125" y1="38" x2="595" y2="38" stroke="#8e8981" stroke-width="1.2"/>
  <!-- Wand oben, Rahmen unten: Montagefuge dazwischen -->
  <rect x="72" y="114" width="565" height="116" class="cut"/>
  <path d="M184 278H559V392H184ZM210 302H533V368H210Z" fill-rule="evenodd" class="frame"/>
  <path d="M292 278V392M448 278V392M184 335H559" class="fine"/>
  <!-- Ebene 1 innen -->
  <rect x="114" y="230" width="42" height="48" fill="#b05c3a" fill-opacity=".24" stroke="#b05c3a" stroke-width="3.2"/>
  <!-- Ebene 2 Mitte: Dämmwellen -->
  <path d="M161 241q14-18 28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0" fill="none" stroke="#1d1b18" stroke-width="1.5"/>
  <path d="M161 267q14-18 28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0" fill="none" stroke="#1d1b18" stroke-width="1.5"/>
  <!-- Ebene 3 außen -->
  <rect x="529" y="230" width="52" height="48" fill="#faf9f6" stroke="#1d1b18" stroke-width="2.4" stroke-dasharray="7 5"/>
  <!-- Nummern und Beschriftungen -->
  <circle cx="135" cy="254" r="13" fill="#b05c3a"/><text x="135" y="259" text-anchor="middle" class="num">1</text>
  <line x1="135" y1="230" x2="135" y2="92" class="fine"/>
  <text x="135" y="91" text-anchor="middle" class="label">innen luftdicht</text>
  <circle cx="347" cy="254" r="13" fill="#1d1b18"/><text x="347" y="259" text-anchor="middle" class="num">2</text>
  <line x1="347" y1="278" x2="347" y2="420" class="fine"/>
  <text x="347" y="444" text-anchor="middle" class="label">Mitte: Dämmung</text>
  <circle cx="555" cy="254" r="13" fill="#1d1b18"/><text x="555" y="259" text-anchor="middle" class="num">3</text>
  <line x1="555" y1="230" x2="555" y2="90" class="fine"/>
  <text x="555" y="82" text-anchor="middle" class="label">außen schlagregendicht</text>
  <text x="555" y="103" text-anchor="middle" class="small">aber diffusionsoffen</text>
  <!-- Trocknungsrichtung -->
  <line x1="421" y1="426" x2="626" y2="426" stroke="#b05c3a" stroke-width="2.4" marker-end="url(#arrowAccent)"/>
  <text x="517" y="414" text-anchor="middle" class="small">Trocknungsrichtung nach außen</text>
</svg>
