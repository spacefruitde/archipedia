<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Horizontalschnitt Fensteranschluss: innen luftdichtere Ebene, außen offenere schlagregendichte Ebene, dazwischen Wärmedämmung">
  <defs>
    <pattern id="schraffur" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1a17" stroke-width="0.7"/>
    </pattern>
    <pattern id="daemmung" width="14" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,5 Q3.5,0 7,5 T14,5" stroke="#1c1a17" stroke-width="0.7" fill="none"/>
    </pattern>
  </defs>
  <!-- Wandlaibung innen -->
  <rect x="40" y="100" width="100" height="140" fill="url(#schraffur)" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Wandlaibung außen -->
  <rect x="340" y="100" width="100" height="140" fill="url(#schraffur)" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Wärmedämmung im Anschlussraum -->
  <rect x="140" y="100" width="70" height="140" fill="url(#daemmung)" stroke="#1c1a17" stroke-width="1.1"/>
  <rect x="270" y="100" width="70" height="140" fill="url(#daemmung)" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Fensterrahmen -->
  <rect x="210" y="90" width="60" height="160" fill="none" stroke="#1c1a17" stroke-width="2.2"/>

  <!-- Luftdichte Ebene innen (Akzent) -->
  <line x1="140" y1="100" x2="140" y2="240" stroke="#b05c3a" stroke-width="2.2"/>
  <!-- Schlagregendichte Ebene außen, offener -->
  <line x1="340" y1="100" x2="340" y2="240" stroke="#1c1a17" stroke-width="1.1" stroke-dasharray="4 3"/>

  <!-- Beschriftungen -->
  <line x1="140" y1="150" x2="90" y2="190" stroke="#1c1a17" stroke-width="1.1"/><circle cx="140" cy="150" r="1.6" fill="#1c1a17"/>
  <text x="86" y="204" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">luftdichte Ebene innen, dichter</text>
  <line x1="340" y1="150" x2="400" y2="190" stroke="#1c1a17" stroke-width="1.1"/><circle cx="340" cy="150" r="1.6" fill="#1c1a17"/>
  <text x="404" y="204" text-anchor="start" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">schlagregendicht außen, offener</text>
  <line x1="175" y1="100" x2="175" y2="60" stroke="#1c1a17" stroke-width="1.1"/><circle cx="175" cy="100" r="1.6" fill="#1c1a17"/>
  <text x="175" y="52" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Wärmedämmebene</text>
</svg>
