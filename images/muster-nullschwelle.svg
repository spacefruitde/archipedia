<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Nullschwelle mit Entwässerungsrinne</title>
  <desc id="desc">Vertikalschnitt einer bodentiefen Tür mit flachem Schwellenprofil, innenliegendem Estrich, Entwässerungsrinne mit freiem Ablauf, hochgeführter Abdichtung und zwei Prozent Gefälle nach außen.</desc>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#1d1b18" stroke-width="1"/></pattern>
    <pattern id="insulation" width="24" height="16" patternUnits="userSpaceOnUse"><path d="M0 8Q6 0 12 8T24 8" fill="none" stroke="#77726b" stroke-width="1.2"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1d1b18"/></marker>
    <style>.cut{fill:url(#hatch);stroke:#1d1b18;stroke-width:3.2}.fine{fill:none;stroke:#1d1b18;stroke-width:1.5}.label{font:16px Arial,Helvetica,sans-serif;fill:#1d1b18}.small{font:14px Arial,Helvetica,sans-serif;fill:#57524c}</style>
  </defs>
  <rect width="720" height="480" fill="#faf9f6"/>
  <text x="65" y="55" class="small">innen</text><text x="660" y="55" text-anchor="end" class="small">außen</text>
  <!-- Innenaufbau -->
  <rect x="36" y="248" width="274" height="12" fill="#e4e0d8" stroke="#1d1b18" stroke-width="2"/>
  <rect x="36" y="260" width="274" height="54" class="cut"/>
  <rect x="36" y="314" width="274" height="42" fill="url(#insulation)" stroke="#1d1b18" stroke-width="2"/>
  <rect x="36" y="356" width="274" height="70" fill="#f1eee8" stroke="#1d1b18" stroke-width="3.2"/>
  <!-- Tür und flaches Schwellenprofil -->
  <path d="M302 70H330V238H302Z" fill="#faf9f6" stroke="#1d1b18" stroke-width="3.2"/>
  <path d="M288 238H377V254H288Z" fill="#f1eee8" stroke="#1d1b18" stroke-width="3.2"/>
  <line x1="330" y1="70" x2="330" y2="228" stroke="#1d1b18" stroke-width="1.5"/>
  <!-- Rinne mit Gitterrost -->
  <path d="M386 254H477V332H386Z" fill="#b05c3a" fill-opacity=".2" stroke="#b05c3a" stroke-width="3.2"/>
  <path d="M390 254H473M396 254v13m12-13v13m12-13v13m12-13v13m12-13v13m12-13v13" stroke="#b05c3a" stroke-width="2"/>
  <path d="M421 332v46h36" fill="none" stroke="#1d1b18" stroke-width="2.4" marker-end="url(#arrow)"/>
  <!-- Außenbelag mit 2 Prozent Gefälle -->
  <path d="M477 260L692 296V330L477 294Z" fill="#eeeae3" stroke="#1d1b18" stroke-width="3.2"/>
  <path d="M477 330L692 366V426H477Z" fill="url(#hatch)" stroke="#1d1b18" stroke-width="2"/>
  <line x1="514" y1="238" x2="649" y2="260" class="fine" marker-end="url(#arrow)"/>
  <text x="582" y="221" text-anchor="middle" class="label">Gefälle 2 %</text>
  <text x="582" y="242" text-anchor="middle" class="small">vom Gebäude weg</text>
  <!-- hochgeführte Abdichtung -->
  <path d="M289 350H377V236" fill="none" stroke="#1d1b18" stroke-width="2.4" stroke-dasharray="8 6"/>
  <!-- Beschriftungen -->
  <line x1="154" y1="282" x2="154" y2="153" class="fine"/><circle cx="154" cy="282" r="3" fill="#1d1b18"/>
  <text x="154" y="141" text-anchor="middle" class="label">Estrich innen</text>
  <line x1="431" y1="254" x2="431" y2="135" class="fine"/><circle cx="431" cy="254" r="3" fill="#1d1b18"/>
  <text x="431" y="102" text-anchor="middle" class="label">Rinne mit</text><text x="431" y="124" text-anchor="middle" class="label">freiem Ablauf</text>
  <line x1="376" y1="311" x2="306" y2="422" class="fine"/><circle cx="376" cy="311" r="3" fill="#1d1b18"/>
  <text x="300" y="440" text-anchor="end" class="label">Abdichtung hochgeführt</text>
</svg>
