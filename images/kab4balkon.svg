<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Vertikalschnitt: Geschossdecke läuft als Balkonplatte durch die gedämmte Außenwand; das tragende Wärmedämmelement in der Wandebene trennt die Platte thermisch">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1a17" stroke-width="0.7"/>
    </pattern>
  </defs>
  <!-- Außenwand tragend, geschnitten, oben und unten -->
  <rect x="220" y="40" width="40" height="110" fill="url(#hatch)" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="220" y="190" width="40" height="100" fill="url(#hatch)" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Außendämmung -->
  <path d="M262 40 V290 M290 40 V290" stroke="#1c1a17" stroke-width="1.1"/>
  <path d="M266 46 q6 8 0 16 t0 16 t0 16 t0 16 t0 16 t0 16 M266 198 q6 8 0 16 t0 16 t0 16 t0 16 t0 16" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Decke innen -->
  <rect x="40" y="150" width="180" height="40" fill="url(#hatch)" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Balkonplatte außen -->
  <rect x="290" y="154" width="150" height="34" fill="url(#hatch)" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- tragendes Wärmedämmelement in der Wandebene, Akzent -->
  <rect x="220" y="150" width="70" height="40" fill="#b05c3a" fill-opacity="0.18" stroke="#b05c3a" stroke-width="2.2"/>
  <line x1="222" y1="160" x2="288" y2="160" stroke="#b05c3a" stroke-width="1.1"/>
  <line x1="222" y1="180" x2="288" y2="180" stroke="#b05c3a" stroke-width="1.1"/>
  <!-- Beschriftungen -->
  <line x1="130" y1="170" x2="130" y2="110" stroke="#1c1a17" stroke-width="1.1"/><circle cx="130" cy="170" r="1.6" fill="#1c1a17"/>
  <text x="130" y="104" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Geschossdecke innen</text>
  <line x1="370" y1="171" x2="370" y2="110" stroke="#1c1a17" stroke-width="1.1"/><circle cx="370" cy="171" r="1.6" fill="#1c1a17"/>
  <text x="370" y="104" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Balkonplatte außen</text>
  <line x1="255" y1="186" x2="210" y2="236" stroke="#b05c3a" stroke-width="1.1"/><circle cx="255" cy="186" r="1.6" fill="#b05c3a"/>
  <text x="204" y="250" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">tragendes Wärmedämmelement:</text>
  <text x="204" y="262" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">Zug, Druck und Querkraft</text>
  <line x1="276" y1="240" x2="330" y2="262" stroke="#1c1a17" stroke-width="1.1"/><circle cx="276" cy="240" r="1.6" fill="#1c1a17"/>
  <text x="334" y="266" text-anchor="start" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Außendämmung</text>
  <text x="130" y="300" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Schnitt, innen links</text>
</svg>
