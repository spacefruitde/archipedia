<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Schnitt durch die Wand-Boden-Ecke im Bad: Verbundabdichtung unter Fliesen auf Wand und Boden, in der Ecke mit einem Dichtband überbrückt, Fliesenfuge in der Ecke elastisch">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1a17" stroke-width="0.7"/>
    </pattern>
  </defs>
  <!-- Wand und Estrich, geschnitten -->
  <rect x="80" y="40" width="60" height="220" fill="url(#hatch)" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="140" y="210" width="300" height="50" fill="url(#hatch)" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Fliesen mit Kleber: Wand und Boden -->
  <rect x="140" y="40" width="14" height="150" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="170" y="196" width="270" height="14" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Verbundabdichtung: Akzentlinie an Wand und Boden -->
  <path d="M140 40 V190 M170 210 H440" fill="none" stroke="#b05c3a" stroke-width="2.2"/>
  <!-- Dichtband in der Ecke, eingebettet -->
  <path d="M140 176 V210 H184" fill="none" stroke="#b05c3a" stroke-width="2.2"/>
  <path d="M140 170 V216 H190 V204 H152 V170 Z" fill="#b05c3a" fill-opacity="0.18" stroke="none"/>
  <!-- elastische Eckfuge -->
  <rect x="154" y="190" width="16" height="8" fill="none" stroke="#1c1a17" stroke-width="1.1" stroke-dasharray="2 2"/>
  <!-- Beschriftungen -->
  <line x1="147" y1="110" x2="220" y2="80" stroke="#1c1a17" stroke-width="1.1"/><circle cx="147" cy="110" r="1.6" fill="#1c1a17"/>
  <text x="224" y="76" text-anchor="start" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Wandfliese auf Kleber</text>
  <line x1="141" y1="140" x2="240" y2="130" stroke="#b05c3a" stroke-width="1.1"/><circle cx="141" cy="140" r="1.6" fill="#b05c3a"/>
  <text x="244" y="134" text-anchor="start" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">Verbundabdichtung unter der Fliese</text>
  <line x1="168" y1="212" x2="260" y2="270" stroke="#b05c3a" stroke-width="1.1"/><circle cx="168" cy="212" r="1.6" fill="#b05c3a"/>
  <text x="264" y="274" text-anchor="start" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">Dichtband in der Ecke eingebettet</text>
  <line x1="162" y1="192" x2="330" y2="170" stroke="#1c1a17" stroke-width="1.1"/><circle cx="162" cy="192" r="1.6" fill="#1c1a17"/>
  <text x="334" y="166" text-anchor="start" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">elastische Eckfuge</text>
  <text x="300" y="300" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Schnitt, Wand links, Estrich unten</text>
</svg>
