<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Schnitt durch eine Südfassade mit Dachüberstand: Die flache Wintersonne scheint unter dem Überstand hindurch tief in den Raum, die hohe Sommersonne wird vom Überstand abgefangen">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1a17" stroke-width="0.7"/>
    </pattern>
  </defs>
  <!-- Raum: Boden, Decke mit Überstand, Fenster -->
  <rect x="40" y="250" width="260" height="16" fill="url(#hatch)" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="40" y="84" width="330" height="16" fill="url(#hatch)" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="290" y="100" width="10" height="150" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Überstand, Akzent -->
  <rect x="300" y="84" width="70" height="16" fill="#b05c3a" fill-opacity="0.18" stroke="#b05c3a" stroke-width="2.2"/>
  <!-- Wintersonne flach: kommt durch -->
  <line x1="460" y1="150" x2="300" y2="196" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="300" y1="196" x2="120" y2="248" stroke="#1c1a17" stroke-width="1.1" stroke-dasharray="4 3"/>
  <!-- Sommersonne steil: wird abgefangen -->
  <line x1="440" y1="30" x2="372" y2="86" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="372" y1="86" x2="356" y2="99" stroke="#1c1a17" stroke-width="1.1" stroke-dasharray="2 2"/>
  <!-- Beschriftungen -->
  <text x="448" y="24" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Sommer: hoch</text>
  <text x="466" y="142" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Winter: flach</text>
  <line x1="335" y1="92" x2="300" y2="40" stroke="#b05c3a" stroke-width="1.1"/><circle cx="335" cy="92" r="1.6" fill="#b05c3a"/>
  <text x="296" y="36" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">Überstand fängt die Sommersonne ab</text>
  <line x1="200" y1="225" x2="160" y2="290" stroke="#1c1a17" stroke-width="1.1"/><circle cx="200" cy="225" r="1.6" fill="#1c1a17"/>
  <text x="160" y="304" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Wintersonne reicht tief in den Raum</text>
  <text x="60" y="170" text-anchor="start" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">innen</text>
  <text x="420" y="240" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Süden</text>
</svg>
