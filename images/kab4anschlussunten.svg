<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Vertikalschnitt durch den unteren Fensteranschluss: Blendrahmen auf der Brüstung, außen die Fensterbank mit Gefälle und darunter eine zweite Dichtebene, die an der Rahmenunterkante hochgeführt ist">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1a17" stroke-width="0.7"/>
    </pattern>
  </defs>
  <!-- Brüstungswand geschnitten -->
  <rect x="180" y="190" width="120" height="100" fill="url(#hatch)" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Außendämmung -->
  <path d="M300 190 V290 M330 200 V290" stroke="#1c1a17" stroke-width="1.1"/>
  <path d="M306 210 q6 8 0 16 t0 16 t0 16 t0 16" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Blendrahmen unten mit Glas -->
  <rect x="210" y="150" width="60" height="40" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="234" y="40" width="12" height="110" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Fensterbank außen mit Gefälle -->
  <path d="M270 176 L352 196 L352 202 L270 184 Z" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- zweite Dichtebene unter der Bank, am Rahmen hochgeführt: Akzent -->
  <path d="M268 170 V190 L330 205" fill="none" stroke="#b05c3a" stroke-width="2.2"/>
  <path d="M268 190 L330 205 L330 212 L268 197 Z" fill="#b05c3a" fill-opacity="0.18" stroke="none"/>
  <!-- Innenbank -->
  <rect x="160" y="180" width="50" height="8" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Beschriftungen -->
  <line x1="240" y1="90" x2="180" y2="70" stroke="#1c1a17" stroke-width="1.1"/><circle cx="240" cy="90" r="1.6" fill="#1c1a17"/>
  <text x="174" y="66" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Fensterelement</text>
  <line x1="320" y1="186" x2="400" y2="134" stroke="#1c1a17" stroke-width="1.1"/><circle cx="320" cy="186" r="1.6" fill="#1c1a17"/>
  <text x="400" y="126" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Fensterbank mit Gefälle</text>
  <line x1="300" y1="200" x2="336" y2="250" stroke="#b05c3a" stroke-width="1.1"/><circle cx="300" cy="200" r="1.6" fill="#b05c3a"/>
  <text x="340" y="254" text-anchor="start" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">zweite Dichtebene,</text>
  <text x="340" y="266" text-anchor="start" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">am Rahmen hochgeführt</text>
  <line x1="185" y1="184" x2="120" y2="220" stroke="#1c1a17" stroke-width="1.1"/><circle cx="185" cy="184" r="1.6" fill="#1c1a17"/>
  <text x="114" y="224" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Innenbank</text>
  <text x="240" y="306" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Brüstung geschnitten, außen rechts</text>
</svg>
