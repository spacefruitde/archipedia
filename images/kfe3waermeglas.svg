<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Wärmeschutzverglasung</title>
  <desc id="desc">Vertikalschnitt einer Dreifach-Isolierverglasung mit drei Scheiben, zwei gasgefüllten Zwischenräumen, wärmereflektierender Beschichtung und Randverbund mit warmer Kante.</desc>
  <defs>
    <pattern id="gas" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="7" cy="8" r="1.3" fill="#77726b"/><circle cx="21" cy="20" r="1.3" fill="#77726b"/></pattern>
    <style>.glass{fill:#f7fbfc;stroke:#1d1b18;stroke-width:3.2}.fine{fill:none;stroke:#1d1b18;stroke-width:1.5}.label{font:16px Arial,Helvetica,sans-serif;fill:#1d1b18}.small{font:14px Arial,Helvetica,sans-serif;fill:#57524c}</style>
  </defs>
  <rect width="720" height="480" fill="#faf9f6"/>
  <!-- Drei Scheiben und zwei Gasräume -->
  <rect x="172" y="74" width="18" height="294" class="glass"/>
  <rect x="292" y="74" width="18" height="294" class="glass"/>
  <rect x="412" y="74" width="18" height="294" class="glass"/>
  <rect x="190" y="74" width="102" height="294" fill="url(#gas)" stroke="#1d1b18" stroke-width="1.2"/>
  <rect x="310" y="74" width="102" height="294" fill="url(#gas)" stroke="#1d1b18" stroke-width="1.2"/>
  <!-- Beschichtung auf innerer Scheibenoberfläche -->
  <line x1="310" y1="76" x2="310" y2="366" stroke="#b05c3a" stroke-width="4"/>
  <!-- Randverbund unten -->
  <rect x="190" y="333" width="102" height="35" fill="#d8d3cb" stroke="#1d1b18" stroke-width="2"/>
  <rect x="310" y="333" width="102" height="35" fill="#d8d3cb" stroke="#1d1b18" stroke-width="2"/>
  <path d="M158 369H445L465 405H140Z" fill="#f1eee8" stroke="#1d1b18" stroke-width="3.2"/>
  <!-- Beschriftungen -->
  <line x1="181" y1="127" x2="84" y2="91" class="fine"/><circle cx="181" cy="127" r="3" fill="#1d1b18"/>
  <text x="77" y="85" text-anchor="end" class="label">Scheiben</text>
  <line x1="237" y1="206" x2="92" y2="206" class="fine"/><circle cx="237" cy="206" r="3" fill="#1d1b18"/>
  <text x="84" y="212" text-anchor="end" class="label">Gasfüllung</text>
  <line x1="310" y1="146" x2="498" y2="104" class="fine"/><circle cx="310" cy="146" r="3" fill="#1d1b18"/>
  <text x="506" y="101" class="label">wärmereflektierende</text><text x="506" y="123" class="label">Beschichtung</text>
  <line x1="362" y1="348" x2="512" y2="389" class="fine"/><circle cx="362" cy="348" r="3" fill="#1d1b18"/>
  <text x="520" y="389" class="label">Randverbund /</text><text x="520" y="411" class="label">warme Kante</text>
</svg>
