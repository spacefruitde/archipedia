<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Drei Fugenlösungen am Zargenspiegel</title>
  <desc id="desc">Drei Detailschnitte zeigen Pressfuge, Acrylfuge und eine hervorgehobene Schattenfuge von etwa fünf Millimetern.</desc>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#1d1b18" stroke-width="1"/></pattern>
    <style>.cut{fill:url(#hatch);stroke:#1d1b18;stroke-width:3.2}.heavy{fill:#faf9f6;stroke:#1d1b18;stroke-width:3.2}.fine{fill:none;stroke:#1d1b18;stroke-width:1.5}.label{font:16px Arial,Helvetica,sans-serif;fill:#1d1b18}.small{font:14px Arial,Helvetica,sans-serif;fill:#57524c}.panel{font:bold 14px Arial,Helvetica,sans-serif;letter-spacing:1.2px;fill:#1d1b18}</style>
  </defs>
  <rect width="720" height="480" fill="#faf9f6"/>
  <line x1="240" y1="72" x2="240" y2="407" stroke="#b6b1aa" stroke-width="1" stroke-dasharray="5 7"/>
  <line x1="480" y1="72" x2="480" y2="407" stroke="#b6b1aa" stroke-width="1" stroke-dasharray="5 7"/>

  <!-- Pressfuge -->
  <text x="120" y="58" text-anchor="middle" class="panel">PRESSFUGE</text>
  <rect x="45" y="137" width="87" height="212" class="cut"/>
  <rect x="132" y="165" width="55" height="156" class="heavy"/>
  <line x1="132" y1="165" x2="132" y2="321" stroke="#1d1b18" stroke-width="4.5"/>
  <line x1="132" y1="244" x2="93" y2="383" class="fine"/><circle cx="132" cy="244" r="3" fill="#1d1b18"/>
  <text x="120" y="408" text-anchor="middle" class="label">direkt angelegt</text>

  <!-- Acrylfuge -->
  <text x="360" y="58" text-anchor="middle" class="panel">ACRYLFUGE</text>
  <rect x="285" y="137" width="87" height="212" class="cut"/>
  <rect x="380" y="165" width="55" height="156" class="heavy"/>
  <path d="M372 165Q380 171 380 181V305Q380 315 372 321Z" fill="#d6d1c9" stroke="#1d1b18" stroke-width="1.5"/>
  <line x1="376" y1="171" x2="347" y2="99" class="fine"/><circle cx="376" cy="171" r="3" fill="#1d1b18"/>
  <text x="342" y="90" text-anchor="middle" class="small">verspachtelte Kehle</text>
  <text x="360" y="408" text-anchor="middle" class="label">elastisch geschlossen</text>

  <!-- Schattenfuge -->
  <text x="600" y="58" text-anchor="middle" class="panel">SCHATTENFUGE</text>
  <rect x="525" y="137" width="87" height="212" class="cut"/>
  <rect x="628" y="165" width="55" height="156" class="heavy"/>
  <rect x="612" y="165" width="16" height="156" fill="#b05c3a" fill-opacity=".2"/>
  <line x1="612" y1="165" x2="612" y2="321" stroke="#b05c3a" stroke-width="3.2"/>
  <line x1="620" y1="244" x2="592" y2="383" class="fine"/><circle cx="620" cy="244" r="3" fill="#1d1b18"/>
  <text x="600" y="408" text-anchor="middle" class="label">ca. 5 mm offen</text>
</svg>
