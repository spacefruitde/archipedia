<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Zwei Isolierglas-Aufbauten im Schnitt: symmetrisch mit gleichen Scheibendicken, asymmetrisch mit dicker Verbundscheibe und Schallschutzfolie">
  <!-- links: symmetrischer Aufbau, zwei gleiche Scheiben -->
  <text x="120" y="22" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">symmetrisch: gleiche Dicken</text>
  <rect x="96" y="44" width="8" height="200" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="136" y="44" width="8" height="200" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="104" y="220" width="32" height="24" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Schwingungsandeutung: beide Scheiben gleich -->
  <path d="M100 100 q6 10 0 20 q-6 10 0 20 q6 10 0 20" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <path d="M140 100 q6 10 0 20 q-6 10 0 20 q6 10 0 20" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- rechts: asymmetrischer Aufbau, dicke Verbundscheibe mit Folie -->
  <text x="350" y="22" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">asymmetrisch: ungleiche Dicken</text>
  <rect x="316" y="44" width="16" height="200" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="323" y="44" width="2" height="200" fill="#b05c3a" stroke="none"/>
  <rect x="364" y="44" width="8" height="200" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="332" y="220" width="32" height="24" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Schwingungsandeutung: dicke Scheibe träge, dünne schwingt -->
  <path d="M324 100 q3 10 0 20 q-3 10 0 20 q3 10 0 20" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <path d="M368 100 q6 10 0 20 q-6 10 0 20 q6 10 0 20" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Beschriftungen -->
  <line x1="324" y1="150" x2="290" y2="132" stroke="#b05c3a" stroke-width="1.1"/><circle cx="324" cy="150" r="1.6" fill="#b05c3a"/>
  <text x="286" y="126" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">Schallschutzfolie</text>
  <text x="286" y="138" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">im Verbundglas</text>
  <line x1="120" y1="232" x2="120" y2="270" stroke="#1c1a17" stroke-width="1.1"/><circle cx="120" cy="232" r="1.6" fill="#1c1a17"/>
  <text x="120" y="284" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Randverbund</text>
  <line x1="348" y1="232" x2="348" y2="270" stroke="#1c1a17" stroke-width="1.1"/><circle cx="348" cy="232" r="1.6" fill="#1c1a17"/>
  <text x="348" y="284" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">breiterer Zwischenraum hilft zusätzlich</text>
  <text x="240" y="308" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Schwingungen schematisch, Raumseite jeweils links</text>
</svg>
