<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Detail: Neigung und Tropfkante der Außenfensterbank">
  <defs>
    <pattern id="schraffur" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1a17" stroke-width="0.7"/>
    </pattern>
  </defs>
  <!-- Fassade / Brüstung -->
  <rect x="60" y="120" width="140" height="160" fill="url(#schraffur)" stroke="#1c1a17" stroke-width="2.2"/>
  <line x1="200" y1="120" x2="200" y2="280" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Rahmenansatz -->
  <rect x="80" y="60" width="60" height="60" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Bank mit Gefälle -->
  <path d="M 140 112 L 252 132" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Tropfkante (Akzent) -->
  <path d="M 252 132 L 252 152 L 244 152" fill="none" stroke="#b05c3a" stroke-width="2.2"/>
  <!-- Wassertropfen -->
  <line x1="250" y1="160" x2="250" y2="176" stroke="#b05c3a" stroke-width="1.1"/>
  <line x1="250" y1="184" x2="250" y2="200" stroke="#b05c3a" stroke-width="1.1"/>
  <!-- Gefällepfeil -->
  <line x1="152" y1="94" x2="236" y2="110" stroke="#1c1a17" stroke-width="1.1"/>
  <path d="M 236 110 L 227 104 L 229 114 Z" fill="#1c1a17"/>
  <text x="196" y="84" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Gefälle mind. 3 bis 5 %</text>
  <!-- Abstandsmaß Tropfkante zur Fassade -->
  <line x1="200" y1="216" x2="252" y2="216" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="200" y1="210" x2="200" y2="222" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="252" y1="210" x2="252" y2="222" stroke="#1c1a17" stroke-width="1.1"/>
  <text x="330" y="220" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Abstand min. 2 cm</text>
  <!-- Beschriftungen -->
  <line x1="252" y1="140" x2="352" y2="116" stroke="#b05c3a" stroke-width="1.1"/><circle cx="252" cy="140" r="1.6" fill="#b05c3a"/>
  <text x="380" y="96" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">Tropfkante: Wasser fällt</text>
  <text x="380" y="108" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">frei ab, nicht an die Wand</text>
  <line x1="130" y1="200" x2="130" y2="296" stroke="#1c1a17" stroke-width="1.1"/><circle cx="130" cy="200" r="1.6" fill="#1c1a17"/>
  <text x="130" y="310" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Fassade / Brüstung</text>
  <line x1="110" y1="60" x2="110" y2="40" stroke="#1c1a17" stroke-width="1.1"/><circle cx="110" cy="60" r="1.6" fill="#1c1a17"/>
  <text x="110" y="32" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Blendrahmen</text>
</svg>
