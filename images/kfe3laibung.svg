<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Grundriss der Fensterlaibung: Anschlussfuge mit drei Ebenen von außen nach innen">
  <defs>
    <pattern id="schraffur" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1a17" stroke-width="0.7"/>
    </pattern>
  </defs>
  <!-- Wand in Grundriss, Laibung rechts -->
  <rect x="40" y="100" width="160" height="120" fill="url(#schraffur)" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Fensterrahmen im Grundriss, in der Öffnung -->
  <rect x="240" y="128" width="56" height="64" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <line x1="268" y1="128" x2="268" y2="192" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Glas-Andeutung -->
  <line x1="296" y1="156" x2="440" y2="156" stroke="#1c1a17" stroke-width="2.2"/>
  <line x1="296" y1="164" x2="440" y2="164" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Anschlussfuge: drei Ebenen von außen (oben) nach innen (unten) -->
  <!-- außen: Wetterschutz -->
  <rect x="200" y="128" width="40" height="14" fill="#1c1a17"/>
  <!-- Mitte: Dämmung (Wellen) -->
  <path d="M 204 156 q 6 -5 12 0 q 6 5 12 0 q 6 -5 11 0 M 204 172 q 6 -5 12 0 q 6 5 12 0 q 6 -5 11 0" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- innen: Luftdichtheit (Akzent) -->
  <rect x="200" y="178" width="40" height="14" fill="#b05c3a" fill-opacity="0.18" stroke="#b05c3a" stroke-width="2.2"/>
  <!-- Orientierung -->
  <text x="120" y="84" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#6f6a61">außen</text>
  <text x="120" y="248" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#6f6a61">innen</text>
  <!-- Beschriftungen -->
  <line x1="220" y1="135" x2="330" y2="70" stroke="#1c1a17" stroke-width="1.1"/><circle cx="220" cy="135" r="1.6" fill="#1c1a17"/>
  <text x="356" y="50" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">außen: Wetterschutz,</text>
  <text x="356" y="62" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">schlagregendicht, dampfoffen</text>
  <line x1="228" y1="164" x2="330" y2="220" stroke="#1c1a17" stroke-width="1.1"/><circle cx="228" cy="164" r="1.6" fill="#1c1a17"/>
  <text x="360" y="236" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Mitte: Fugendämmung</text>
  <line x1="220" y1="185" x2="300" y2="256" stroke="#b05c3a" stroke-width="1.1"/><circle cx="220" cy="185" r="1.6" fill="#b05c3a"/>
  <text x="322" y="272" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">innen: Luftdichtheitsebene,</text>
  <text x="322" y="284" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">dichter als außen</text>
  <line x1="120" y1="160" x2="120" y2="160" stroke="#1c1a17" stroke-width="1.1"/>
  <text x="120" y="164" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Wand (Laibung)</text>
  <line x1="284" y1="128" x2="330" y2="104" stroke="#1c1a17" stroke-width="1.1"/><circle cx="284" cy="128" r="1.6" fill="#1c1a17"/>
  <text x="378" y="98" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Fensterrahmen</text>
  <text x="240" y="312" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Grundriss: Alle drei Ebenen laufen ohne Unterbrechung um die Laibungsecke.</text>
</svg>
