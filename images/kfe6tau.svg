<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Zwei Schnitte durch den unteren Glasrand im Rahmenfalz: Mit Aluminiumabstandhalter erreicht die Taupunktisotherme die Raumseite der Scheibe, mit warmer Kante bleibt sie im Randverbund und Rahmen">
  <!-- linker Schnitt: Aluminium-Abstandhalter -->
  <text x="140" y="18" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Aluminium: Tauwasser am Glasrand</text>
  <rect x="110" y="34" width="10" height="180" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="160" y="34" width="10" height="180" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="120" y="158" width="40" height="26" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Rahmen mit Glasfalz, stumme Kontur -->
  <rect x="84" y="192" width="112" height="78" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <path d="M104 192 V214 H176 V192" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Maßlinie Glaseinstand ohne Zahl -->
  <line x1="186" y1="192" x2="186" y2="214" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="182" y1="192" x2="190" y2="192" stroke="#1c1a17" stroke-width="1.1"/>
  <line x1="182" y1="214" x2="190" y2="214" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Isothermen: im Feld senkrecht, am Rand zur Raumseite gezogen -->
  <path d="M140 34 V150 Q140 185 124 200 L118 232" fill="none" stroke="#1c1a17" stroke-width="1.1" stroke-dasharray="3 3"/>
  <path d="M148 34 V160 Q148 198 136 214 L130 252" fill="none" stroke="#1c1a17" stroke-width="1.1" stroke-dasharray="3 3"/>
  <!-- Taupunktisotherme, Akzent: erreicht die Raumseite oberhalb des Falzes -->
  <path d="M132 34 V140 Q132 168 110 176 L104 200" fill="none" stroke="#b05c3a" stroke-width="2.2"/>
  <g fill="#b05c3a" fill-opacity="0.18" stroke="#b05c3a" stroke-width="1.1">
    <circle cx="105" cy="150" r="3"/><circle cx="104" cy="162" r="3"/><circle cx="105" cy="174" r="3"/>
  </g>

  <!-- rechter Schnitt: warme Kante -->
  <text x="340" y="18" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">warme Kante: Rand bleibt trocken</text>
  <rect x="310" y="34" width="10" height="180" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="360" y="34" width="10" height="180" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="320" y="158" width="40" height="26" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="284" y="192" width="112" height="78" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <path d="M304 192 V214 H376 V192" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <path d="M340 34 V172 Q340 212 332 232 L328 268" fill="none" stroke="#1c1a17" stroke-width="1.1" stroke-dasharray="3 3"/>
  <path d="M348 34 V178 Q348 218 342 240 L338 268" fill="none" stroke="#1c1a17" stroke-width="1.1" stroke-dasharray="3 3"/>
  <!-- Taupunktisotherme, Akzent: bleibt in Randverbund und Rahmen -->
  <path d="M332 34 V166 Q332 204 322 222 L316 268" fill="none" stroke="#b05c3a" stroke-width="2.2"/>

  <!-- Glaseinstand -->
  <line x1="186" y1="203" x2="202" y2="203" stroke="#1c1a17" stroke-width="1.1"/><circle cx="186" cy="203" r="1.6" fill="#1c1a17"/>
  <text x="240" y="207" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Glaseinstand</text>

  <!-- Legende -->
  <line x1="100" y1="284" x2="124" y2="284" stroke="#b05c3a" stroke-width="2.2"/>
  <text x="130" y="288" text-anchor="start" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Taupunktisotherme, 9,3 °C bei 20 °C und 50 % r. F.</text>
  <line x1="100" y1="298" x2="124" y2="298" stroke="#1c1a17" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="130" y="302" text-anchor="start" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">weitere Isothermen</text>
  <text x="240" y="316" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Raumseite jeweils links, Außenseite rechts</text>
</svg>
