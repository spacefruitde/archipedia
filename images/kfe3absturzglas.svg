<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Bodentiefes Fenster mit absturzsicherndem Verbundsicherheitsglas">
  <!-- Ansicht bodentiefes Fenster -->
  <rect x="50" y="40" width="150" height="240" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="62" y="52" width="126" height="216" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Absturzhöhe-Andeutung: Boden + Person-Pfeil -->
  <line x1="30" y1="280" x2="220 " y2="280" stroke="#1c1a17" stroke-width="2.2"/>
  <line x1="125" y1="120" x2="125" y2="200" stroke="#b05c3a" stroke-width="1.1"/>
  <path d="M 125 200 L 119 190 L 131 190 Z" fill="#b05c3a"/>
  <text x="125" y="110" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">Absturzgefahr</text>
  <text x="125" y="220" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">keine Brüstung:</text>
  <text x="125" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Glas sichert ab</text>
  <text x="125" y="300" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#6f6a61">Ansicht, bodentief</text>
  <!-- Schnitt durch VSG, stark vergrößert -->
  <rect x="300" y="60" width="26" height="200" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <rect x="342" y="60" width="26" height="200" fill="none" stroke="#1c1a17" stroke-width="2.2"/>
  <!-- Verbundfolie (Akzent) -->
  <rect x="326" y="60" width="16" height="200" fill="#b05c3a" fill-opacity="0.18" stroke="#b05c3a" stroke-width="2.2"/>
  <!-- Bruch-Andeutung linke Scheibe -->
  <path d="M 306 100 L 318 128 L 308 156 L 320 186" fill="none" stroke="#1c1a17" stroke-width="1.1"/>
  <!-- Beschriftungen Schnitt -->
  <line x1="313" y1="60" x2="290" y2="38" stroke="#1c1a17" stroke-width="1.1"/><circle cx="313" cy="60" r="1.6" fill="#1c1a17"/>
  <text x="278" y="30" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">Scheibe kann brechen</text>
  <line x1="334" y1="60" x2="392" y2="38" stroke="#b05c3a" stroke-width="1.1"/><circle cx="334" cy="60" r="1.6" fill="#b05c3a"/>
  <text x="404" y="30" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">Verbundfolie hält die</text>
  <text x="404" y="42" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#b05c3a">Bruchstücke zusammen</text>
  <line x1="355" y1="180" x2="404" y2="180" stroke="#1c1a17" stroke-width="1.1"/><circle cx="355" cy="180" r="1.6" fill="#1c1a17"/>
  <text x="408" y="184" text-anchor="start" font-family="-apple-system,sans-serif" font-size="11" fill="#1c1a17">2. Scheibe</text>
  <text x="334" y="300" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#6f6a61">Schnitt VSG, stark vergrößert</text>
</svg>
