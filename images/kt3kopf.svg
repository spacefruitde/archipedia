<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Kopfhöhe an der Treppenlochkante</title>
  <desc id="desc">Treppenschnitt mit lotrechtem Mindestmaß von zwei Metern über der Stufenvorderkante bis zur Unterseite der geschnittenen Decke. Die Deckenkante ist hervorgehoben.</desc>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#1d1b18" stroke-width="1"/></pattern>
    <pattern id="concrete" width="38" height="28" patternUnits="userSpaceOnUse"><circle cx="7" cy="9" r="1.2" fill="#6d6861"/><path d="M25 18l4 6h-8z" fill="none" stroke="#6d6861" stroke-width="1"/></pattern>
    <marker id="dim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 1L1 4L8 7" fill="none" stroke="#1d1b18" stroke-width="1.2"/></marker>
    <style>.cut{fill:url(#hatch);stroke:#1d1b18;stroke-width:3.2}.stair{fill:url(#concrete);stroke:#1d1b18;stroke-width:3.2;stroke-linejoin:miter}.fine{fill:none;stroke:#1d1b18;stroke-width:1.5}.label{font:16px Arial,Helvetica,sans-serif;fill:#1d1b18}.small{font:14px Arial,Helvetica,sans-serif;fill:#57524c}</style>
  </defs>
  <rect width="720" height="480" fill="#faf9f6"/>
  <!-- Decke mit Öffnung rechts -->
  <path d="M24 80H374V126H24Z" class="cut"/>
  <rect x="364" y="78" width="16" height="51" fill="#b05c3a" fill-opacity=".24"/>
  <line x1="374" y1="79" x2="374" y2="127" stroke="#b05c3a" stroke-width="4"/>
  <!-- Treppenlauf -->
  <path d="M78 422V376H146V330H214V284H282V238H350V192H418V422Z" class="stair"/>
  <!-- Maß lotrecht über der Stufenvorderkante -->
  <line x1="350" y1="128" x2="350" y2="237" class="fine" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="338" y1="126" x2="362" y2="126" class="fine"/><line x1="338" y1="238" x2="362" y2="238" class="fine"/>
  <text x="336" y="173" text-anchor="end" class="label">lichte Durchgangshöhe</text>
  <text x="336" y="196" text-anchor="end" class="label">min. 2,00 m</text>
  <text x="336" y="217" text-anchor="end" class="small">lotrecht über Stufenvorderkante</text>
  <!-- Hinweise -->
  <line x1="374" y1="102" x2="509" y2="65" class="fine"/><circle cx="374" cy="102" r="3" fill="#1d1b18"/>
  <text x="516" y="63" class="label">Deckenkante =</text><text x="516" y="85" class="label">kritische Stelle</text>
  <line x1="350" y1="238" x2="487" y2="310" class="fine"/><circle cx="350" cy="238" r="3" fill="#1d1b18"/>
  <text x="494" y="316" class="small">Stufenvorderkante</text>
</svg>
